      const button = document.querySelector("button");
      // button האלמנט שעליו אנחנו מאזינים
      // click סוג האירוע (click hover, changing text)
      // מה לעשות במהלך האירוע
      button.addEventListener("click", () => {
        console.log("היי לחצנו עלייך");
      });
      button.addEventListener("mouseover", () => {
        console.log("היי ריחפנו מעליך");
      });

      function sayHi() {
        console.log("hello");
      }

      button.addEventListener("click", sayHi);
      button.removeEventListener("click", sayHi);
