    <title>חלשה טיפוסית</title>
    <link rel="stylesheet" href="../assets/styles/info.css" />
  </head>
  <body>
    <div id="info">
      <p>
        שפות חלשות טיפוסית מקצות סוגי ערכים למשתנים בזמן ריצה כלומר אתה (המפתח)
        לא יכול להגדיר מראש אילו ערכים המשתנה אמור להכיל. אתה יכול לעשות זאת רק
        בעקיפין, על ידי וידוא שבזמן הריצה אתה תמיד מכניס למשתנים את הערכים
        הנכונים.
      </p>
    </div>
